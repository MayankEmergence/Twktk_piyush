services:
  - type: web
    name: twktk-festival
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_URL
        value: https://www.thosewhoknowtheyknow.com
      - key: ADMIN_EMAILS
        value: mayank@emergencenetwork.in
      - key: CONTACT_EMAIL
        value: Mayank@emergencenetwork.in
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: twktk-database
          property: connectionString
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TnL3T2LiViMSZp
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: twktk-database
    plan: basic-256mb
    databaseName: twktk
    user: twktk
    ipAllowList: []
