  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syncopate:wght@700&display=swap");

    :root {
      --bg: #070709;
      --surface: #0e0e12;
      --border: #1a1a22;
      --text: #ffffff;
      --text-muted: #737380;
      --text-dim: #44444e;
      --accent: #d81f26;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', -apple-system, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* BAR */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .brand-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .brand-sub {
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 1px;
      margin-left: 8px;
    }

    /* VIEWPORT */
    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-vp {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }
    .btn-vp:hover, .btn-vp.active {
      color: var(--text);
      border-color: #383848;
      background: #14141c;
    }

    /* TABS */
    nav.tabs {
      background: #09090c;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* META */
    .meta-bar {
      background: #0b0b0f;
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .meta-items {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .meta-k { color: var(--text-dim); text-transform: uppercase; margin-right: 6px; }
    .meta-v { color: var(--text-muted); }
    .meta-v.subject { color: var(--text); font-weight: 500; }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      font-family: inherit;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
    }
    .btn-copy:hover { color: var(--text); border-color: #383848; }

    /* CANVAS */
    main {
      flex: 1;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      background: var(--bg);
      overflow-y: auto;
    }
    .frame-container {
      width: 540px;
      transition: width 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 840px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: #000000;
    }
  </style>
</head>

    function render() {
      const cur = data[current];
      document.getElementById('subjectDisplay').textContent = cur.subject;

      doc.open();
      doc.write(cur.html);
      doc.close();
    }

    function setTab(idx, btn) {
      current = idx;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setVp(w, btn) {
      document.getElementById('frameBox').style.width = w;
      document.querySelectorAll('.btn-vp').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function copyHtml() {
      navigator.clipboard.writeText(data[current].html).then(() => {
        const b = document.getElementById('copyBtn');
        const orig = b.textContent;
        b.textContent = 'Copied';
        setTimeout(() => b.textContent = orig, 1500);
      });
    }
